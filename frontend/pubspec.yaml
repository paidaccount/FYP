name: vanet_mobile
description: Explainable AI-Based Misbehavior Detection and Trust Management System for VANET
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.4.0

  # API Client
  dio: ^5.4.0

  # Maps and Location Services
  google_maps_flutter: ^2.5.0
  geolocator: ^10.1.0

  # Routing
  go_router: ^13.0.0

  # Storage & Offline Cache
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  isar: ^3.1.0
  isar_flutter_libs: ^3.1.0
  path_provider: ^2.1.1

  # Analytics and Charts
  fl_chart: ^0.66.0

  # Real-time Notifications & Cloud Services
  firebase_core: ^3.0.0
  firebase_messaging: ^15.0.0

  # UI and Icons
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0
  build_runner: ^2.4.8
  isar_generator: ^3.1.0

flutter:
  uses-material-design: true
